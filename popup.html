<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>TV Scroll Capture</title>
<style>
  :root {
    --bg: #131722; --raise: #1e222d; --line: #2a2e39;
    --text: #d1d4dc; --muted: #868993; --blue: #2962ff; --red: #f23645;
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 330px; overflow-x: hidden; background: var(--bg); color: var(--text);
         font: 13px/1.55 "Segoe UI", Tahoma, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header strong { font-size: 14px; font-weight: 600; }
  .candles { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .candles i { width: 3px; background: #089981; border-radius: 1px; }
  .candles i:nth-child(2n) { background: var(--red); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  #dot.rec { background: var(--red); }
  @media (prefers-reduced-motion: no-preference) { #dot.rec { animation: blink 1s infinite; } }
  @keyframes blink { 50% { opacity: .25; } }
  #lang { margin-inline-start: auto; width: auto; padding: 1px 2px; font-size: 11px; }
  header strong { flex: 1 1 auto; min-width: 0; }
  .pre { margin: 10px 14px 0; padding: 8px 10px; background: var(--raise); border-inline-start: 3px solid #ff9800; border-radius: 3px; color: var(--muted); font-size: 12px; }
  .pre b { color: var(--text); font-weight: 600; }
  .group { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); }
  .group h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 5px 0; color: var(--muted); }
  input[type=number], select { width: 92px; flex: none; background: var(--raise); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  label.chk { display: flex; align-items: center; gap: 8px; margin: 5px 0; color: var(--muted); }
  button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 4px; font: 600 13px/1 inherit; font-family: inherit; color: #fff; background: var(--blue); cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button.ghost { background: var(--raise); border: 1px solid var(--line); }
  button.stop { background: var(--red); }
  button.link { width: auto; margin: 4px 0 0; padding: 2px 0; background: none; color: #5b8cff; font-weight: 400; text-decoration: underline; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #5b8cff; outline-offset: 1px; }
  footer { padding: 10px 14px 12px; }
  #status { font-size: 12px; color: var(--muted); min-height: 18px; }
  #notTv { color: #ff9800; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  kbd { background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
  <header>
    <span class="candles" aria-hidden="true"><i style="height:9px"></i><i style="height:14px"></i><i style="height:7px"></i><i style="height:12px"></i></span>
    <strong data-i18n="appTitle"></strong>
    <select id="lang" aria-label="Language">
      <option value="ar" data-i18n="langAr"></option>
      <option value="en" data-i18n="langEn"></option>
    </select>
    <span id="dot" aria-hidden="true"></span>
  </header>

  <p class="pre"><b data-i18n="preTitle"></b> <span data-i18n="preBody"></span></p>
  <p class="pre" id="notTv" hidden data-i18n="notTv"></p>

  <div class="group">
    <h2 data-i18n="autoTitle"></h2>
    <div class="row"><span data-i18n="direction"></span>
      <select id="direction">
        <option value="left" data-i18n="dirLeft"></option>
        <option value="right" data-i18n="dirRight"></option>
      </select>
    </div>
    <div class="row"><span data-i18n="steps"></span> <input id="steps" type="number" min="1" max="400" value="20"></div>
    <div class="row"><span data-i18n="stepPct"></span> <input id="stepPct" type="number" min="10" max="80" value="50"></div>
    <div class="row"><span data-i18n="settleMs"></span> <input id="settleMs" type="number" min="100" max="3000" step="50" value="450"></div>
    <button id="startAuto" class="start" data-i18n="startAuto"></button>
  </div>

  <div class="group">
    <h2 data-i18n="manualTitle"></h2>
    <div class="row"><span data-i18n="intervalMs"></span> <input id="intervalMs" type="number" min="120" max="2000" step="10" value="250"></div>
    <button id="startManual" class="start ghost" data-i18n="startManual"></button>
    <p class="hint"><span data-i18n="manualHint1"></span> <kbd>Alt+Shift+S</kbd><span data-i18n="manualHint2"></span></p>
  </div>

  <div class="group">
    <label class="chk"><input id="autoScaleOff" type="checkbox" checked> <span data-i18n="autoScaleOff"></span></label>
    <label class="chk"><input id="verticalTrack" type="checkbox" checked> <span data-i18n="verticalTrack"></span></label>
    <div class="row"><span data-i18n="maxVert"></span> <input id="maxVert" type="number" min="1" max="30" value="6"></div>
    <label class="chk"><input id="hideOverlays" type="checkbox" checked> <span data-i18n="hideOverlays"></span></label>
    <label class="chk"><input id="includeAxis" type="checkbox" checked> <span data-i18n="includeAxis"></span></label>
    <label class="chk"><input id="debug" type="checkbox"> <span data-i18n="debug"></span></label>
    <button id="openDebug" class="link" data-i18n="openDebug"></button>
  </div>

  <footer>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="stop" class="stop" hidden data-i18n="stop"></button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
